const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),rad=Math.PI/180;
const CITIES={Semarang:[-6.9667,110.4167],Surakarta:[-7.5666,110.8283],Yogyakarta:[-7.7956,110.3695],Jakarta:[-6.2088,106.8456],Bandung:[-6.9175,107.6191],Surabaya:[-7.2575,112.7521],Medan:[3.5952,98.6722],Makassar:[-5.1477,119.4327],Denpasar:[-8.6705,115.2126]};
let loc={lat:-6.9667,lng:110.4167,name:'Semarang'},page='home',snd=true;
try{const s=localStorage.getItem('loc');if(s)loc=JSON.parse(s);snd=localStorage.getItem('snd')!=='0';const t=localStorage.getItem('th');if(t)document.documentElement.dataset.theme=t}catch(e){}
const save=()=>{try{localStorage.setItem('loc',JSON.stringify(loc));localStorage.setItem('snd',snd?'1':'0')}catch(e){}};
function times(d){const jd=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12)/864e5+2440587.5,n=jd-2451545,g=(357.529+.98560028*n)*rad,q=280.459+.98564736*n,L=(q+1.915*Math.sin(g)+.02*Math.sin(2*g))*rad,e=(23.439-4e-7*n)*rad,RA=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))/rad/15,D=Math.asin(Math.sin(e)*Math.sin(L)),eq=(((q/15-RA)%24)+36)%24-12,tz=-d.getTimezoneOffset()/60,lat=loc.lat*rad,dh=12+tz-loc.lng/15-eq,T=a=>Math.acos((Math.sin(a*rad)-Math.sin(lat)*Math.sin(D))/(Math.cos(lat)*Math.cos(D)))/rad/15,as=Math.atan(1/(1+Math.tan(Math.abs(lat-D))))/rad;
 return{Subuh:dh-T(-20),Terbit:dh-T(-.833),Dzuhur:dh+.03,Ashar:dh+T(as),Maghrib:dh+T(-.833),Isya:dh+T(-18)}}
const fmt=h=>{const m=Math.round((((h%24)+24)%24)*60);return pad(Math.floor(m/60)%24)+':'+pad(m%60)};
function nextP(){const d=new Date(),t=times(d),now=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;let e=Object.entries(t).filter(x=>x[0]!=='Terbit').find(x=>x[1]>now);if(e)return{n:e[0],v:e[1],r:e[1]-now};const tm=new Date(d.getTime()+864e5);return{n:'Subuh',v:times(tm).Subuh,r:times(tm).Subuh+24-now}}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[392,494,587,494,392,587,659,587].forEach((f,i)=>{const o=c.createOscillator(),v=c.createGain();o.frequency.value=f;o.connect(v);v.connect(c.destination);const t=c.currentTime+i*.6;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.4,t+.05);v.gain.exponentialRampToValueAtTime(.0001,t+.55);o.start(t);o.stop(t+.6)})}catch(e){}}
let last='';setInterval(()=>{const d=new Date(),k=pad(d.getHours())+':'+pad(d.getMinutes());const c=$('#cd');if(c){const r=nextP().r,s=Math.floor(r*3600);c.textContent=pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}
 if(snd)for(const[n,v]of Object.entries(times(d)))if(n!=='Terbit'&&fmt(v)===k&&last!==k+n){last=k+n;playAdzan(n);try{new Notification('Waktu '+n,{body:k})}catch(e){}}},1000);
const bearing=()=>{const L=loc.lat*rad,k=21.4225*rad,d=(39.8262-loc.lng)*rad;return((Math.atan2(Math.sin(d),Math.cos(L)*Math.tan(k)-Math.sin(L)*Math.cos(d))/rad)+360)%360};
function gps(cb){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lng:p.coords.longitude,name:'Lokasi Anda'};save();cb()},()=>alert('Izin lokasi ditolak atau tidak tersedia.')):alert('GPS tidak didukung.')}
const TILES=[['adzan','🕌','Adzan','Jadwal & Waktu Adzan'],['kiblat','🧭','Kiblat','Arah Kiblat di Mana Saja'],['doa','🤲','Doa','Kumpulan Doa Harian'],['kal','📅','Kalender','Hijriyah, Masehi & Jawa'],['quran','📖',"Al-Qur'an",'Baca & Dengarkan'],['khutbah','🕋',"Khutbah Jum'at",'100 Tema Khutbah']];

 return`<div class="c row"><div>📍 <select id="ct">${Object.keys(CITIES).map(c=>`<option ${c===loc.name?'selected':''}>${c}</option>`).join('')}${CITIES[loc.name]?'':`<option selected>${loc.name}</option>`}</select></div><div style="text-align:right;font-size:13px">${d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}<br><small style="color:var(--mu)">${hj(d,{day:'numeric',month:'long',year:'numeric'})}</small></div></div>
 <div class="c nx"><div>Shalat Berikutnya<br><b>${nx.n}</b><div class="cd" id="cd"></div></div><div style="text-align:right;font-size:22px;font-weight:700">⏰ ${fmt(nx.v)}<br><small style="font-size:13px;font-weight:400">${nx.n}</small></div></div>
 <div class="c pr">${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(n=>`<div class="${n===nx.n?'on':''}">${n}<b>${fmt(t[n])}</b></div>`).join('')}</div>
 <div class="c ay">“Dirikanlah shalat, tunaikanlah zakat, dan rukuklah bersama orang-orang yang rukuk.” <small>(QS. Al-Baqarah: 43)</small></div>
 <div class="tl">${TILES.map(x=>`<button data-p="${x[0]}"><i>${x[1]}</i>${x[2]}<small>${x[3]}</small></button>`).join('')}</div>`}
function adzan(){const t=times(new Date()),nx=nextP().n;return`<div class="c"><b>${loc.name}</b> <small>(${loc.lat.toFixed(3)}, ${loc.lng.toFixed(3)})</small>${Object.entries(t).map(([n,v])=>`<div class="r ${n===nx?'n':''}"><span>${n}</span><span>${fmt(v)}</span></div>`).join('')}</div>
 <div class="c"><button class="bt" id="g">📍 Pakai lokasi saya</button> <button class="bt" id="tt">🔊 Tes suara</button><p><small>Tombol 🔊 di atas menyalakan/mematikan adzan otomatis (aktif: ${snd?'ya':'tidak'}). Suara hanya berbunyi saat aplikasi terbuka. Letakkan file adzan.mp3 (dan adzan-subuh.mp3 untuk Subuh) di folder aplikasi; bila belum ada, berbunyi nada sederhana. Metode Kemenag (Subuh 20°, Isya 18°), hitung lokal; tambahkan ihtiyat ±2 menit.</small></p></div>`}
const C={h:null,sx:0,sy:0,got:0};
function kiblat(){const b=bearing();return`<div class="c" style="text-align:center"><b>Arah kiblat: ${b.toFixed(1)}° dari Utara</b>
 <svg viewBox="0 0 200 200" style="width:240px;max-width:80%;margin:8px auto;display:block"><path d="M100 2l8 14h-16z" fill="var(--ac)"/><g id="dl"><circle cx="100" cy="100" r="80" fill="var(--sf)" stroke="var(--bd)" stroke-width="3"/><text x="100" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#d33">U</text><text x="172" y="106" text-anchor="middle" font-size="13" fill="var(--mu)">T</text><text x="100" y="178" text-anchor="middle" font-size="13" fill="var(--mu)">S</text><text x="28" y="106" text-anchor="middle" font-size="13" fill="var(--mu)">B</text><g transform="rotate(${b} 100 100)"><line x1="100" y1="100" x2="100" y2="38" stroke="var(--ac)" stroke-width="3"/><text x="100" y="40" text-anchor="middle" font-size="22">🕋</text></g></g><circle cx="100" cy="100" r="4" fill="var(--ac)"/></svg>
 <div id="st" style="font-weight:700;color:var(--ac)">Kompas belum aktif</div><p><button class="bt" id="cp">▶ Aktifkan kompas</button> <button class="bt" id="g">📍 Lokasi saya</button></p>
 <small>Lokasi: ${loc.name}. Taruh HP mendatar, jauhkan dari logam/magnet, gerakkan angka 8 untuk kalibrasi. Saat 🕋 tepat di bawah penunjuk atas, Anda menghadap kiblat. Buka langsung di Chrome/Safari (bukan di dalam bingkai) agar sensor diizinkan. Laptop tanpa sensor hanya menampilkan sudut ${b.toFixed(0)}° dari Utara.</small></div>`}
function setHead(h){const k=.25;C.sx+=(Math.sin(h*rad)-C.sx)*k;C.sy+=(Math.cos(h*rad)-C.sy)*k;h=(Math.atan2(C.sx,C.sy)/rad+360)%360;C.h=h;C.got=1;const dl=$('#dl');if(!dl)return;dl.style.transform=`rotate(${-h}deg)`;const df=Math.abs(((bearing()-h+540)%360)-180);$('#st').textContent=df<4?'✅ Anda menghadap kiblat':`Arah HP ${Math.round(h)}° · putar ${Math.round(df)}° lagi`;if(df<4&&navigator.vibrate&&!C.v){navigator.vibrate(60);C.v=1}if(df>=8)C.v=0}
function onOri(e){if(!$('#dl'))return;if(e.webkitCompassHeading!=null)return setHead(e.webkitCompassHeading);if(e.type!=='deviceorientationabsolute'&&e.absolute!==true)return;if(e.alpha==null||e.beta==null||e.gamma==null)return;const z=e.alpha*rad,x=e.beta*rad,y=e.gamma*rad,vx=-Math.cos(z)*Math.sin(y)-Math.sin(z)*Math.sin(x)*Math.cos(y),vy=-Math.sin(z)*Math.sin(y)+Math.cos(z)*Math.sin(x)*Math.cos(y);let h=Math.atan2(vx,vy)/rad;h=(h+360+((screen.orientation&&screen.orientation.angle)||0))%360;setHead(h)}
async function startCompass(){const st=$('#st');if(typeof DeviceOrientationEvent==='undefined'){st.textContent='Perangkat ini tidak punya sensor kompas.';return}

 addEventListener('deviceorientationabsolute',onOri,true);addEventListener('deviceorientation',onOri,true);st.textContent='Menunggu sensor…';C.got=0;

const DOA=[
['Harian','Sapu jagat (kebaikan dunia akhirat)','رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ','Ya Tuhan kami, berilah kebaikan di dunia dan akhirat, lindungi kami dari azab neraka.'],
['Harian','Untuk kedua orang tua','رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا','Ya Tuhanku, ampunilah aku dan kedua orang tuaku, sayangilah mereka sebagaimana mereka mendidikku waktu kecil.'],

['Harian','Penutup majelis (kafaratul majelis)','سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ','Maha Suci Engkau, aku bersaksi tiada tuhan selain Engkau, aku mohon ampun dan bertobat kepada-Mu.'],

['Rutinitas','Masuk masjid','اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ','Ya Allah, bukakan untukku pintu-pintu rahmat-Mu.'],
['Rutinitas','Keluar masjid','اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ','Ya Allah, aku memohon karunia-Mu.'],
['Rutinitas','Keluar rumah','بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ','Dengan nama Allah, aku bertawakal kepada Allah, tiada daya dan kekuatan kecuali dengan Allah.'],
['Rutinitas','Setelah makan','الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ','Segala puji bagi Allah yang memberi kami makan dan minum serta menjadikan kami muslim.'],
['Urusan & Rezeki','Dimudahkan urusan','رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي','Ya Tuhanku, lapangkan dadaku dan mudahkan urusanku.'],
['Urusan & Rezeki','Ilmu bermanfaat','رَبِّ زِدْنِي عِلْمًا وَارْزُقْنِي فَهْمًا','Ya Tuhanku, tambahkan ilmuku dan berilah aku pemahaman.'],
['Urusan & Rezeki','Kecukupan rezeki halal','اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ','Ya Allah, cukupkan aku dengan yang halal dari yang haram, dan kayakan aku dengan karunia-Mu.'],
['Urusan & Rezeki','Saat kesulitan','حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ','Cukuplah Allah bagi kami, Dia sebaik-baik pelindung.'],
['Urusan & Rezeki','Memohon keturunan sholih','رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا','Ya Tuhan kami, anugerahkan pasangan dan keturunan penyejuk hati, jadikan kami pemimpin orang bertakwa.'],
['Perlindungan','Sayyidul istighfar','اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ خَلَقْتَنِي وَأَنَا عَبْدُكَ وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ','Doa istighfar utama: mengakui nikmat dan dosa, memohon ampun kepada Allah.'],
['Perlindungan','Perlindungan pagi & petang','بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ','Dengan nama Allah yang bersama nama-Nya tak ada yang membahayakan di bumi dan langit; Dia Maha Mendengar, Maha Mengetahui.'],
['Perlindungan','Terhindar dari malas, takut & hutang','اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ وَالْعَجْزِ وَالْكَسَلِ وَالْجُبْنِ وَالْبُخْلِ وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ','Ya Allah, aku berlindung dari gundah, sedih, lemah, malas, penakut, kikir, lilitan hutang dan penindasan manusia.'],
['Perlindungan','Saat tertimpa musibah','إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ','Sesungguhnya kami milik Allah dan kepada-Nya kami kembali.'],
['Perlindungan','Memohon hujan','اللَّهُمَّ اسْقِنَا غَيْثًا مُغِيثًا هَنِيئًا مَرِيئًا نَافِعًا غَيْرَ ضَارٍّ عَاجِلًا غَيْرَ آجِلٍ','Ya Allah, turunkan hujan yang menolong, menyegarkan, bermanfaat, tidak membahayakan, segera.'],
['Perjalanan','Safar / naik kendaraan','سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ','Maha Suci yang menundukkan ini bagi kami, dan kepada Tuhan kami pasti kembali.'],
['Salat','Ruku','سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ','Maha Suci Tuhanku Yang Maha Agung, dengan memuji-Nya.'],
['Salat','I\'tidal','رَبَّنَا لَكَ الْحَمْدُ','Ya Tuhan kami, bagi-Mu segala puji.'],
['Salat','Sujud','سُبْحَانَ رَبِّيَ الْأَعْلَى وَبِحَمْدِهِ','Maha Suci Tuhanku Yang Maha Tinggi, dengan memuji-Nya.'],
['Salat','Duduk di antara dua sujud','رَبِّ اغْفِرْ لِي وَارْحَمْنِي وَاجْبُرْنِي وَارْفَعْنِي وَارْزُقْنِي وَاهْدِنِي وَعَافِنِي وَاعْفُ عَنِّي','Ya Tuhanku, ampuni, rahmati, cukupi, angkat derajatku, beri rezeki, petunjuk, kesehatan, dan maafkan aku.'],
['Salat','Setelah witir','سُبْحَانَ الْمَلِكِ الْقُدُّوسِ','Maha Suci Raja Yang Maha Suci.'],
['Shalawat','Shalawat Ibrahimiyah','اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ','Shalawat dalam tahiyat akhir salat.'],
['Shalawat','Shalawat Nariyah','اللَّهُمَّ صَلِّ صَلَاةً كَامِلَةً وَسَلِّمْ سَلَامًا تَامًّا عَلَى سَيِّدِنَا مُحَمَّدٍ الَّذِي تَنْحَلُّ بِهِ الْعُقَدُ وَتَنْفَرِجُ بِهِ الْكُرَبُ وَتُقْضَى بِهِ الْحَوَائِجُ وَتُنَالُ بِهِ الرَّغَائِبُ وَحُسْنُ الْخَوَاتِمِ وَيُسْتَسْقَى الْغَمَامُ بِوَجْهِهِ الْكَرِيمِ وَعَلَى آلِهِ وَصَحْبِهِ فِي كُلِّ لَمْحَةٍ وَنَفَسٍ بِعَدَدِ كُلِّ مَعْلُومٍ لَكَ','Shalawat dan salam sempurna kepada Nabi Muhammad ﷺ, yang dengannya terurai kesulitan dan terpenuhi hajat.'],
['Salat','Iftitah (Allahumma baid & wajjahtu)','اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ، اللَّهُمَّ نَقِّنِي مِنَ الْخَطَايَا كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ اغْسِلْ خَطَايَايَ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ. (Atau:) إِنِّي وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا مُسْلِمًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ لَا شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ','Memohon dijauhkan dari dosa dan dibersihkan; atau menyerahkan seluruh ibadah, hidup, dan mati hanya kepada Allah.'],
['Salat','Iftitah (Allahu akbar kabira)','اللَّهُ أَكْبَرُ كَبِيرًا وَالْحَمْدُ لِلَّهِ كَثِيرًا وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلًا','Allah Maha Besar dengan sebesar-besarnya, segala puji bagi Allah sebanyak-banyaknya, Maha Suci Allah pagi dan petang.'],
['Salat','Tahiyat akhir','التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ','Segala penghormatan, keberkahan, dan kebaikan milik Allah; salam atas Nabi dan hamba-hamba yang saleh; aku bersaksi tiada tuhan selain Allah dan Muhammad utusan-Nya.'],
['Salat','Sebelum salam (perlindungan)','اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ جَهَنَّمَ وَمِنْ عَذَابِ الْقَبْرِ وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ','Ya Allah, aku berlindung dari azab neraka, azab kubur, fitnah hidup dan mati, dan kejahatan fitnah Dajjal.'],
['Salat','Qunut subuh & witir','اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ وَعَافِنِي فِيمَنْ عَافَيْتَ وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ وَبَارِكْ لِي فِيمَا أَعْطَيْتَ وَقِنِي شَرَّ مَا قَضَيْتَ فَإِنَّكَ تَقْضِي وَلَا يُقْضَى عَلَيْكَ وَإِنَّهُ لَا يَذِلُّ مَنْ وَالَيْتَ وَلَا يَعِزُّ مَنْ عَادَيْتَ تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ فَلَكَ الْحَمْدُ عَلَى مَا قَضَيْتَ أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ','Ya Allah, tunjukilah, sehatkanlah, dan lindungilah aku, berkahilah pemberian-Mu, dan jauhkan aku dari keburukan takdir; Engkau yang menetapkan, tak ada yang menetapkan atas-Mu.'],
['Salat','Dzikir setelah salat fardhu','أَسْتَغْفِرُ اللَّهَ (3×) اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ. لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. سُبْحَانَ اللَّهِ (33×) الْحَمْدُ لِلَّهِ (33×) اللَّهُ أَكْبَرُ (33×)','Istighfar, memohon keselamatan, tauhid, lalu tasbih, tahmid, takbir masing-masing 33 kali.'],
['Salat','Ayat Kursi (QS. Al-Baqarah: 255)','اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ','Ayat tentang keesaan dan kekuasaan Allah, dianjurkan dibaca setelah salat dan sebelum tidur.'],
['Rutinitas','Sebelum makan','اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ بِسْمِ اللَّهِ','Ya Allah, berkahilah rezeki kami dan lindungi kami dari azab neraka. Dengan nama Allah.'],
['Rutinitas','Memakai pakaian','الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ','Segala puji bagi Allah yang memberiku pakaian ini tanpa daya dan kekuatan dariku.'],
['Rutinitas','Bercermin','اللَّهُمَّ كَمَا حَسَّنْتَ خَلْقِي فَحَسِّنْ خُلُقِي','Ya Allah, sebagaimana Engkau baguskan rupaku, baguskan pula akhlakku.'],
['Perlindungan','Menjenguk orang sakit','لَا بَأْسَ طَهُورٌ إِنْ شَاءَ اللَّهُ','Tidak mengapa, semoga sakit ini menjadi pembersih dosa, insya Allah.'],
['Perlindungan','Akhir Al-Baqarah (QS. 2:286)','لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنْتَ مَوْلَانَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ','Allah tidak membebani di luar kesanggupan; doa memohon ampun, kemudahan, dan pertolongan.'],
['Tahlil','Istighfar & kalimat tauhid','أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ (3×) لَا إِلَهَ إِلَّا اللَّهُ (berulang) سُبْحَانَ اللَّهِ وَبِحَمْدِهِ سُبْحَانَ اللَّهِ الْعَظِيمِ','Istighfar, tahlil, dan tasbih yang lazim dibaca dalam tahlilan.'],
['Tahlil','Al-Ikhlas, Al-Falaq, An-Nas','قُلْ هُوَ اللَّهُ أَحَدٌ اللَّهُ الصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ. قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ مِنْ شَرِّ مَا خَلَقَ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ. قُلْ أَعُوذُ بِرَبِّ النَّاسِ مَلِكِ النَّاسِ إِلَهِ النَّاسِ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ مِنَ الْجِنَّةِ وَالنَّاسِ','Tiga surat pendek tentang tauhid dan perlindungan.'],
['Tahlil','Doa untuk jenazah/arwah','اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ وَأَكْرِمْ نُزُلَهُ وَوَسِّعْ مُدْخَلَهُ وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ','Ya Allah, ampuni, rahmati, sehatkan, dan maafkan dia, muliakan tempatnya, luaskan kuburnya, dan bersihkan dari dosa.'],
['Shalawat','Shalawat Jibril','صَلَّى اللَّهُ عَلَى مُحَمَّدٍ','Semoga Allah melimpahkan shalawat kepada Muhammad.'],

const ISI={0:`<b>Mukadimah.</b> Jamaah Jumat rahimakumullah. Mari kita awali dengan syukur atas nikmat iman dan Islam, yang nilainya jauh melampaui seluruh isi dunia. Hari ini kita membahas pokok dari semua pokok agama: tauhid, yaitu mengesakan Allah dalam keyakinan, doa, dan ibadah kita.<br><br><b>Tujuan penciptaan kita.</b> Allah berfirman dalam QS. Adz-Dzariyat ayat 56 bahwa Dia tidak menciptakan jin dan manusia kecuali agar mereka beribadah kepada-Nya. Seluruh rasul, dari Nuh sampai Muhammad ﷺ, membawa seruan yang sama. Dalam QS. An-Nahl ayat 36 Allah menegaskan bahwa Dia mengutus seorang rasul pada setiap umat dengan pesan: sembahlah Allah dan jauhilah thaghut. Maka tauhid bukan pelajaran pinggiran, melainkan alasan kita ada.<br><br>Dalam hadits dari Mu'adz bin Jabal yang diriwayatkan Bukhari dan Muslim, Rasulullah ﷺ bertanya, "Wahai Mu'adz, tahukah engkau apa hak Allah atas hamba-Nya dan apa hak hamba atas Allah?" Beliau menjawab sendiri: hak Allah atas hamba adalah mereka beribadah kepada-Nya dan tidak menyekutukan-Nya dengan apa pun, dan hak hamba atas Allah adalah Dia tidak mengazab orang yang tidak menyekutukan-Nya.<br><br><b>Bahaya syirik.</b> Karena tauhid sepenting itu, syirik adalah dosa yang paling berbahaya. Allah berfirman dalam QS. An-Nisa ayat 48 bahwa Dia tidak mengampuni dosa menyekutukan-Nya bagi yang meninggal di atasnya, dan mengampuni dosa selain itu bagi siapa yang Dia kehendaki. Luqman menasihati putranya dalam QS. Luqman ayat 13: "Wahai anakku, jangan menyekutukan Allah. Sungguh syirik itu kezaliman yang besar." Dalam hadits Abu Bakrah riwayat Bukhari dan Muslim, Nabi ﷺ menyebut dosa terbesar: menyekutukan Allah, durhaka kepada orang tua, dan kesaksian palsu.<br><br><b>Wajah syirik di zaman kita.</b> Banyak orang mengira syirik hanya menyembah patung. Padahal Allah bertanya dalam QS. Al-Jatsiyah ayat 23: tidakkah engkau melihat orang yang menjadikan hawa nafsunya sebagai tuhannya? Rasulullah ﷺ bersabda dalam riwayat Bukhari, "Celakalah hamba dinar dan hamba dirham", yaitu orang yang hidupnya diperbudak harta: ia ridha bila diberi, murka bila tidak. Hari ini berhala itu bisa berupa jabatan, popularitas, jumlah pengikut, atau rasa takut pada kehilangan pekerjaan sampai kita berani menipu dan menyuap. Nabi ﷺ juga memperingatkan dalam riwayat Ahmad bahwa yang paling beliau khawatirkan atas umatnya adalah syirik kecil, yaitu riya, beramal agar dilihat dan dipuji manusia.<br><br>Ada pula keyakinan pada jimat dan ramalan. Dalam riwayat Ahmad, Nabi ﷺ bersabda bahwa siapa yang menggantungkan jimat, Allah tidak akan menyempurnakan urusannya. Dan dalam riwayat Muslim beliau bersabda bahwa siapa yang mendatangi peramal lalu menanyakan sesuatu, salatnya tidak diterima selama empat puluh malam. Bukan karena peramal itu pasti benar, tetapi karena hati yang bertanya kepadanya sedang mencari kepastian di pintu yang salah. Bintang, tanggal "naas", dan benda bertuah tidak memiliki kuasa mendatangkan manfaat atau mudarat.<br><br><b>Kisah Nabi Ibrahim.</b> Kita belajar tauhid dari Khalilullah. Ketika kaumnya melemparkannya ke dalam api yang menyala, Ibnu Abbas menceritakan dalam riwayat Bukhari bahwa ucapan Ibrahim saat itu adalah <span class="ai">حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ</span>, "Cukuplah Allah bagi kami, dan Dia sebaik-baik pelindung." Allah menjawabnya dalam QS. Al-Anbiya ayat 69: "Wahai api, jadilah dingin dan selamatkan Ibrahim." Ibrahim tidak menyembah keadaan, tidak takut pada kekuasaan, dan tidak mencari pertolongan kepada selain Allah.<br><br><b>Kisah sahabat: Bilal dan Abu Bakar.</b> Sirah mencatat bagaimana Bilal bin Rabah disiksa Umayyah bin Khalaf di padang pasir Makkah yang membara, dadanya ditindih batu besar. Semua siksaan itu hanya dijawab dengan satu kata: "Ahad, Ahad", Allah Maha Esa. Penyiksanya mampu menekan tubuhnya, tetapi tidak mampu menggeser tauhid dari hatinya. Lihat pula Abu Bakar di gua Tsur. Saat kaum musyrik mengejar dan Abu Bakar gemetar, Nabi ﷺ menenangkannya dengan kalimat yang diabadikan dalam QS. At-Taubah ayat 40: <span class="ai">لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا</span>, "Jangan bersedih, sesungguhnya Allah bersama kita." Itulah tauhid yang hidup: tenang karena tahu siapa yang menjaga.<br><br><b>Kisah ulama: keteguhan Imam Ahmad.</b> Imam Ahmad bin Hanbal dipenjara dan dicambuk pada masa Khalifah Al-Ma'mun dan Al-Mu'tashim karena menolak menyatakan Al-Qur'an itu makhluk, padahal itu bertentangan dengan keyakinan yang beliau terima dari ulama salaf. Ia bertahan, dan sejarah mencatatnya sebagai teladan keteguhan menjaga akidah di bawah tekanan penguasa. Tekanan zaman kita lebih halus, tetapi hakikatnya sama: apakah kita menjual keyakinan demi keselamatan, kenyamanan, atau pengakuan?<br><br><b>Tauhid itu menenangkan.</b> Surah Al-Ikhlas mengajarkan: <span class="ai">قُلْ هُوَ اللَّهُ أَحَدٌ، اللَّهُ الصَّمَدُ</span>. Ibnu Abbas menafsirkan ash-shamad sebagai Dzat yang kepada-Nya seluruh makhluk bergantung dalam segala kebutuhan dan permintaan, sebagaimana dikutip para ahli tafsir seperti Ibnu Jarir dan Ibnu Katsir. Bila yang kita bergantung kepadanya adalah Dzat yang tidak pernah lemah, tidur, atau lupa, mengapa kita begitu mudah panik karena manusia? Allah berfirman dalam QS. Ath-Thalaq ayat 3, siapa yang bertawakal kepada-Nya, Dia akan mencukupinya. Dalam hadits riwayat Tirmidzi dan Ahmad, Nabi ﷺ bersabda bahwa seandainya kalian bertawakal kepada Allah dengan sebenar-benarnya, niscaya Dia memberi kalian rezeki sebagaimana burung diberi rezeki: pergi pagi dalam keadaan lapar dan pulang sore dalam keadaan kenyang. Perhatikan: burung itu pergi. Tawakal bukan berpangku tangan, melainkan berikhtiar sungguh-sungguh sambil menyerahkan hasilnya kepada Allah.<br><br><b>Cara menjaga tauhid.</b> Pertama, belajar akidah dari guru dan kitab yang jelas sanadnya, supaya kita bisa membedakan yang benar dari yang menyimpang. Kedua, perbanyak doa dan dzikir, karena doa adalah pengakuan bahwa kita butuh kepada-Nya; Nabi ﷺ bersabda dalam riwayat Tirmidzi bahwa doa adalah inti ibadah. Ketiga, periksa niat sebelum dan sesudah beramal, sebab riya sering masuk dari pintu yang tidak kita sadari. Keempat, jauhi ramalan, jimat, dan keyakinan sial pada benda atau tanggal. Kelima, jadikan halal dan haram sebagai pedoman dalam bekerja, berbisnis, dan bermedia sosial, bukan sekadar tren atau untung rugi. Keenam, ingat wasiat Nabi ﷺ kepada Ibnu Abbas dalam riwayat Tirmidzi: "Jagalah Allah, niscaya Dia menjagamu. Jagalah Allah, engkau akan menemukan-Nya di hadapanmu."<br><br><b>Penutup.</b> Jamaah sekalian, dalam hadits riwayat Abu Daud, Nabi ﷺ bersabda bahwa siapa yang akhir ucapannya <span class="ai">لَا إِلَهَ إِلَّا اللَّهُ</span> akan masuk surga. Semoga Allah mewafatkan kita di atas kalimat itu, setelah kita menjalani hidup dengan menepati maknanya.`};
const AR1="إِنَّ الْحَمْدَ لِلَّهِ نَحْمَدُهُ وَنَسْتَعِينُهُ وَنَسْتَغْفِرُهُ، وَنَعُوذُ بِاللَّهِ مِنْ شُرُورِ أَنْفُسِنَا وَمِنْ سَيِّئَاتِ أَعْمَالِنَا، مَنْ يَهْدِهِ اللَّهُ فَلَا مُضِلَّ لَهُ وَمَنْ يُضْلِلْ فَلَا هَادِيَ لَهُ. أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ. اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِينَ. أَمَّا بَعْدُ، فَيَا عِبَادَ اللَّهِ، أُوصِيكُمْ وَنَفْسِي بِتَقْوَى اللَّهِ فَقَدْ فَازَ الْمُتَّقُونَ. قَالَ اللَّهُ تَعَالَى: يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ حَقَّ تُقَاتِهِ وَلَا تَمُوتُنَّ إِلَّا وَأَنْتُمْ مُسْلِمُونَ";
const AR1E="بَارَكَ اللَّهُ لِي وَلَكُمْ فِي الْقُرْآنِ الْعَظِيمِ وَنَفَعَنِي وَإِيَّاكُمْ بِمَا فِيهِ مِنَ الْآيَاتِ وَالذِّكْرِ الْحَكِيمِ، أَقُولُ قَوْلِي هَذَا فَأَسْتَغْفِرُ اللَّهَ لِي وَلَكُمْ فَاسْتَغْفِرُوهُ إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ";
const ARM="رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ";
const AR2="الْحَمْدُ لِلَّهِ عَلَى إِحْسَانِهِ وَالشُّكْرُ لَهُ عَلَى تَوْفِيقِهِ وَامْتِنَانِهِ، وَأَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ تَعْظِيمًا لِشَأْنِهِ، وَأَشْهَدُ أَنَّ سَيِّدَنَا مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ الدَّاعِي إِلَى رِضْوَانِهِ. اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَأَصْحَابِهِ وَسَلِّمْ تَسْلِيمًا كَثِيرًا. أَمَّا بَعْدُ، فَيَا أَيُّهَا النَّاسُ اتَّقُوا اللَّهَ فِيمَا أَمَرَ وَانْتَهُوا عَمَّا نَهَى، وَاعْلَمُوا أَنَّ اللَّهَ أَمَرَكُمْ بِأَمْرٍ بَدَأَ فِيهِ بِنَفْسِهِ وَثَنَّى بِمَلَائِكَتِهِ بِقُدْسِهِ، فَقَالَ تَعَالَى: إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ، وَارْضَ اللَّهُمَّ عَنِ الْخُلَفَاءِ الرَّاشِدِينَ وَعَنْ سَائِرِ الصَّحَابَةِ وَالتَّابِعِينَ. اللَّهُمَّ اغْفِرْ لِلْمُسْلِمِينَ وَالْمُسْلِمَاتِ وَالْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ الْأَحْيَاءِ مِنْهُمْ وَالْأَمْوَاتِ، إِنَّكَ سَمِيعٌ قَرِيبٌ مُجِيبُ الدَّعَوَاتِ. رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ. عِبَادَ اللَّهِ، إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ وَإِيتَاءِ ذِي الْقُرْبَى وَيَنْهَى عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ وَالْبَغْيِ يَعِظُكُمْ لَعَلَّكُمْ تَذَكَّرُونَ، فَاذْكُرُوا اللَّهَ الْعَظِيمَ يَذْكُرْكُمْ وَاشْكُرُوهُ عَلَى نِعَمِهِ يَزِدْكُمْ، وَلَذِكْرُ اللَّهِ أَكْبَرُ";
function khutbah(){const T=KH.flatMap(k=>k[1].split('|'));
 if(KD>=0){const A=(h,t)=>`<h3 style="color:var(--ac);margin:14px 0 4px">${h}</h3><div class="ar">${t}</div>`;
  return`<button class="bk dk" data-kd="-1">← Daftar tema</button><div class="c"><h3 style="margin:0">${KD+1}. ${T[KD]}</h3>${A('Khutbah Pertama: pembukaan, wasiat takwa, dan ayat',AR1)}<h3 style="color:var(--ac);margin:14px 0 4px">Isi khutbah</h3><p>${ISI[KD]||'<i>Isi khutbah untuk tema ini belum ditulis.</i>'}</p>${A('Penutup khutbah pertama',AR1E)}${A('Doa saat duduk di antara dua khutbah',ARM)}${A('Khutbah Kedua, shalawat, dan doa penutup',AR2)}<small style="color:var(--mu)">Teks Arab adalah rangkaian baku khutbah yang lazim dipakai. Mohon diperiksa takmir/ustadz sebelum dipakai.</small></div>`}
 let n=0;return`<div class="c"><small>Ketuk judul untuk membuka khutbah. Rangkaian Arab (pembuka, doa tengah, doa penutup) tersedia untuk semua tema; isi khutbah lengkap baru tersedia untuk tema 1.</small></div>`+KH.map(k=>`<details><summary>${k[0]}</summary><div>${k[1].split('|').map(t=>`<div class="r" style="cursor:pointer" data-kd="${n}"><span>${++n}. ${t}</span><span>›</span></div>`).join('')}</div></details>`).join('')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-cm],[data-cn],[data-q],[data-kd],[data-sr],[data-lg],[data-sv],[data-md],[data-pg]');if(!t)return;const D=t.dataset;

 else if(D.q){QM=D.q;draw()}else if(D.sr!=null){const n=+D.sr;if(n&&PGS&&PGS.length>=604){let q=1;PGS.forEach((t,i)=>{if(t[0]*1000+t[1]<=n*1000+1)q=i+1});PG=q;MD='halaman';SR=0}else SR=n;scrollTo(0,0);draw()}else if(D.lg){LG=D.lg;draw()}else if(D.md){MD=D.md;draw()}else if(D.pg){PG=Math.min(604,Math.max(1,PG+ +D.pg));draw()}else if(D.sv)saveAll();else if(D.kd!=null){const k=+D.kd;if(k<0&&history.state&&history.state.kd>=0){history.back();return}KD=k;if(k>=0)history.pushState({p:'khutbah',kd:k},'');scrollTo(0,0);draw()}});

async function pageLoad(){const p=PG,l=LG==='en'?'en':'id',a=PGS[p-1],b=PGS[p]||[115,1],last=b[1]===1?b[0]-1:b[0];let out='',tr='';
